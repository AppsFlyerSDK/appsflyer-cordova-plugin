# =============================================================================
# Lint, Test & Build — reusable only (workflow_call)
# =============================================================================
#
# 1) vitest + tsc --noEmit on the TS transport layer (src/). Cordova Jasmine tests under
#    tests/ are not run in CI.
# 2) ./gradlew testDebugUnitTest against the real Android shim source (android-tests/ — a
#    scratch Gradle module, mirrors ios-tests/'s SPM harness; not part of the plugin's own
#    distribution).
# 3) Optional Cordova debug builds for Android + iOS (same scripts as android-e2e / ios-e2e).
#
# Trigger: workflow_call only. Caller: rc-release.yml (and any future workflows that reuse it).
# =============================================================================

name: Lint, Test & Build

on:
  workflow_call:
    inputs:
      skip_unit:
        description: 'Skip unit-test job (vitest + typecheck)'
        required: false
        type: boolean
        default: false
      skip_builds:
        description: 'Skip Android + iOS Cordova build jobs'
        required: false
        type: boolean
        default: false

concurrency:
  group: ltb-cordova-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    if: ${{ inputs.skip_unit != true }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install
      - run: npm test

  check-native-version-pairs:
    name: Check native version pairs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: iOS + Android dual-pin pairs must be known-good
        run: |
          chmod +x scripts/check-native-version-pairs.sh
          ./scripts/check-native-version-pairs.sh \
            "$(node -p "require('./package.json').iosSdkVersion")" \
            "$(node -p "require('./package.json').iosFrameworkVersion")" \
            "$(node -p "require('./package.json').androidSdkVersion")" \
            "$(node -p "require('./package.json').androidPluginBridgeVersion")"

  android-unit-tests:
    name: Android shim unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-34
            build-tools;34.0.0
      - name: gradlew testDebugUnitTest
        working-directory: android-tests
        run: ./gradlew testDebugUnitTest

  build-android:
    name: Build Cordova E2E app (Android)
    runs-on: ubuntu-latest
    needs: [test, check-native-version-pairs, android-unit-tests]
    if: ${{ (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.check-native-version-pairs.result == 'success' && needs.android-unit-tests.result == 'success' && inputs.skip_builds != true }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-34
            platform-tools
            build-tools;34.0.0
      - run: npm install -g cordova
      - name: Build Android (E2E sibling)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          CORDOVA_E2E_ANDROID_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/e2e-cordova-build.sh android

  build-ios:
    name: Build Cordova E2E app (iOS)
    runs-on: macos-15
    needs: test
    if: ${{ (needs.test.result == 'success' || needs.test.result == 'skipped') && inputs.skip_builds != true }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Xcode toolchain (runner default)
        run: |
          xcode-select -p
          xcodebuild -version
      - run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods -N
          fi
      - run: npm install -g cordova
      - name: Build iOS (simulator)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/e2e-cordova-build.sh ios
