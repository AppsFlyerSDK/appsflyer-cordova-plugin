repositories {
	mavenCentral()
}

dependencies {
	implementation 'com.android.installreferrer:installreferrer:2.1'
	implementation platform('com.appsflyer:af-android-sdk-bom:7.0.1')
	implementation 'com.appsflyer:af-android-sdk'
	// Pinned explicitly — af-android-sdk-bom does not yet carry this version.
	implementation 'com.appsflyer:af-android-plugin-bridge:7.0.12'
	// No explicit kotlin-stdlib pin: cordova-android's kotlin-android plugin (GradlePluginKotlinEnabled, see plugin.xml) auto-adds the stdlib matching its own Kotlin version; pinning here separately would just drift stale again (last pin, 1.6.20, was from 2022).
	// Real org.json impl for JVM unit tests — Android's mockable android.jar stubs org.json methods to throw, which parseJsonOrDefault would otherwise silently swallow.
	testImplementation 'org.json:json:20240303'
}
