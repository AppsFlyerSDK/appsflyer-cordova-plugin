repositories {
	mavenCentral()
}

dependencies {
	implementation 'com.android.installreferrer:installreferrer:2.1'
	implementation platform('com.appsflyer:af-android-sdk-bom:7.0.1')
	implementation 'com.appsflyer:af-android-sdk'
	// Pinned explicitly — af-android-sdk-bom does not yet carry this version.
	implementation 'com.appsflyer:af-android-plugin-bridge:7.0.12'
	implementation 'com.android.support:support-annotations:28.0.0'
	implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.6.20'
	// Real org.json impl for JVM unit tests — Android's mockable android.jar stubs org.json
	// methods to throw, which parseJsonOrDefault would otherwise silently swallow.
	testImplementation 'org.json:json:20240303'
}
